<footer class="footer-container">
  <div class="footer-content">
    <div class="footer-section">
      <mat-icon>place</mat-icon>
      <div>
        <p>Endereço Aqui, 465,78</p>
        <button mat-button (click)="openMaps()">Ver no mapa</button>
      </div>
    </div>

    <div class="footer-section">
      <mat-icon>phone</mat-icon>
      <div>
        <button mat-button (click)="callPhone('123345456')">123345456</button>
        <button mat-button (click)="callPhone('123345456')">123345456</button>
      </div>
    </div>

    <div class="footer-section">
      <mat-icon>chat</mat-icon>
      <div>
        <button mat-button (click)="openWhatsApp('123345456')">123345456</button>
      </div>
    </div>

    <div class="footer-section">
      <mat-icon>link</mat-icon>
      <ul>
        <li><button mat-button (click)="navigateToInfo()">Início</button></li>
        <li><button mat-button (click)="navigateToAbout()">Sobre</button></li>
        <li><button mat-button (click)="navigateToRooms()">Salas</button></li>
        <li><button mat-button (click)="navigateToContact()">Contato</button></li>
      </ul>
    </div>

    <div class="footer-section">
      <mat-icon>thumb_up</mat-icon>
      <div class="social-links">
        <button mat-icon-button (click)="openInstagram()" matTooltip="Instagram">
          <mat-icon>camera_alt</mat-icon>
        </button>
        <button mat-icon-button (click)="openWhatsApp('123345456')" matTooltip="WhatsApp">
          <mat-icon>chat</mat-icon>
        </button>
        <button mat-icon-button (click)="openTwitter()" matTooltip="Twitter">
          <mat-icon>alternate_email</mat-icon>
        </button>
      </div>
    </div>

    <div class="footer-bottom">
      <mat-icon class="me-1">copyright</mat-icon>
