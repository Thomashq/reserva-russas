
<div mat-dialog-content class="p-3">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h2 class="m-0">{{ isReadOnly ? 'Detalhes da Reserva' : 'Editar Reserva' }}</h2>
  </div>

  <form [formGroup]="frm" (ngSubmit)="onSubmit()">
    <div class="row g-2">

      <div class="col-12 col-md-4">
        <mat-form-field class="w-100">
          <mat-label>Sala</mat-label>
          <mat-select formControlName="roomId">
            <mat-option *ngFor="let room of roomList" [value]="room.Id">
              {{ room.Name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="col-12 col-md-8">
        <mat-form-field class="w-100">
          <mat-label>Título</mat-label>
          <input matInput formControlName="title" required>
        </mat-form-field>
      </div>

      <div class="col-12">
        <mat-form-field class="w-100">
          <mat-label>Descrição</mat-label>
          <textarea matInput rows="3" formControlName="description"></textarea>
        </mat-form-field>
      </div>

      <div class="col-12 col-md-4">
        <mat-form-field class="w-100">
          <mat-label>Data</mat-label>
          <input matInput [matDatepicker]="datePicker"
                 formControlName="date"
                 (dateChange)="onDateChange($event.value)"
                 required>
          <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
          <mat-datepicker #datePicker></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="col-12 col-md-4">
        <mat-form-field class="w-100">
          <mat-label>Início (hora)</mat-label>
          <input matInput type="time"
                 [value]="startTimeDisplay"
                 #startTimeRef
                 (change)="onTimeChange('start', startTimeRef.value)"
                 required>
        </mat-form-field>
      </div>

      <div class="col-12 col-md-4">
        <mat-form-field class="w-100">
          <mat-label>Fim (hora)</mat-label>
          <input matInput type="time"
                 [value]="endTimeDisplay"
                 #endTimeRef
                 (change)="onTimeChange('end', endTimeRef.value)"
                 required>
        </mat-form-field>
      </div>

    </div>

    <div class="d-flex justify-content-end gap-2 mt-3">
      <button mat-stroked-button color="primary" type="button" (click)="onCancel()">
        Fechar
      </button>

      <button mat-raised-button color="primary" type="button" *ngIf="isReadOnly" (click)="enableEdit()">
        <mat-icon>edit</mat-icon>
        Editar
      </button>

      <button mat-raised-button color="primary" type="submit"
              *ngIf="!isReadOnly"
              [disabled]="frm.invalid || isLoading">
        Salvar
      </button>
    </div>
  </form>
</div>
