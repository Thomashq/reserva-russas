<mat-card class="mb-3">
  <mat-card-header class="d-flex align-items-center">
    <div>
      <mat-card-title>Reservas de Hoje</mat-card-title>
      <mat-card-subtitle>{{ formatDateLabel() }}</mat-card-subtitle>
    </div>
    <div class="ms-auto d-flex gap-2">
      <button mat-icon-button (click)="previousDay()">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button mat-button (click)="today()">Hoje</button>
      <button mat-icon-button (click)="nextDay()">
        <mat-icon>chevron_right</mat-icon>
      </button>
      <button *ngIf="isLoggedIn"
              mat-raised-button
              color="primary"
              (click)="openNewReservationDialog()">
        <mat-icon>add</mat-icon>
        Nova
      </button>
    </div>
  </mat-card-header>

  <mat-card-content>
    <!-- Loading -->
    <div *ngIf="isLoading" class="d-flex justify-content-center p-4">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && !reservations.length"
         class="text-center text-muted p-4">
      Nenhuma reserva para este dia
    </div>

    <!-- Lista de Reservas -->
    <div *ngIf="!isLoading && reservations.length">

      <!-- Cards de Reservas -->
      <mat-card *ngFor="let r of dataSource.filteredData" class="mb-3">
        <mat-card-content>
          <div class="row align-items-center">

            <!-- Horário -->
            <div class="col-12 col-md-3">
              <div class="d-flex align-items-center gap-2">
                <mat-icon color="primary">schedule</mat-icon>
                <div>
                  <div class="fw-bold">
                    {{ formatTime(r.StartTime ) }} – {{ formatTime(r.EndTime ) }}
                  </div>
                </div>
              </div>
            </div>

            <!-- Sala -->
            <div class="col-12 col-md-2 mt-2 mt-md-0">
              <div class="d-flex align-items-center gap-2">
                <mat-icon color="accent">meeting_room</mat-icon>
                <div class="fw-bold">
                  {{ getRoomNameById(r.RoomId ) }}
                </div>
              </div>
            </div>

            <!-- Descrição -->
            <div class="col-12 col-md-6 mt-2 mt-md-0">
              <div class="d-flex align-items-center gap-2">
                <mat-icon>description</mat-icon>
                <div>
                  {{ r.Title }}
                </div>
              </div>
            </div>

            <!-- Ações -->
            <div class="col-12 col-md-1 mt-2 mt-md-0 text-end" *ngIf="isLoggedIn">
              <button mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="editReservation(getId(r))">
                  <mat-icon>edit</mat-icon>
                  <span>Editar</span>
                </button>
                <button mat-menu-item (click)="cancelReservation(getId(r))">
                  <mat-icon>delete</mat-icon>
                  <span>Cancelar</span>
                </button>
              </mat-menu>
            </div>

          </div>
        </mat-card-content>
      </mat-card>

      <!-- Paginação -->
      <mat-paginator
        [pageSize]="pageSize"
        [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons>
      </mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
