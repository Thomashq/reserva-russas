
<mat-card>
  <mat-card-header>
    <mat-card-title>
      Próximas reservas
    </mat-card-title>
    <mat-card-subtitle>Esta semana</mat-card-subtitle>

    <div style="margin-left:auto; display:flex; gap:8px;">
      <button mat-button (click)="refresh()">
        <mat-icon>refresh</mat-icon>
        Atualizar
      </button>
      <button mat-raised-button color="primary" (click)="openNewReservationDialog()">
        <mat-icon>add</mat-icon>
        Nova reserva
      </button>
    </div>
  </mat-card-header>

  <mat-card-content>
    <ng-template #loadingTpl>
      <div class="loading">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    </ng-template>

    <ng-container *ngIf="!isLoading; else loadingTpl">
      <ng-container *ngIf="reservations?.length; else emptyTpl">

        <table mat-table [dataSource]="dataSource" [attr.aria-busy]="isLoading">

          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Título</th>
            <td mat-cell *matCellDef="let r">{{ r.Title || r.title }}</td>
          </ng-container>

          <ng-container matColumnDef="room">
            <th mat-header-cell *matHeaderCellDef>Sala</th>
            <td mat-cell *matCellDef="let r">
              {{ (r.Room?.Name || r.room?.name) || ('#' + (r.RoomId ?? r.roomId)) }}
            </td>
          </ng-container>

          <ng-container matColumnDef="start">
            <th mat-header-cell *matHeaderCellDef>Início</th>
            <td mat-cell *matCellDef="let r">
              {{ formatDateTime(r.StartTime || r.startTime) }}
            </td>
          </ng-container>

          <ng-container matColumnDef="end">
            <th mat-header-cell *matHeaderCellDef>Fim</th>
            <td mat-cell *matCellDef="let r">
              {{ formatDateTime(r.EndTime || r.endTime) }}
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let r">
              <button mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="editReservation(getId(r))">
                  <mat-icon>edit</mat-icon>
                  Editar
                </button>
                <button mat-menu-item (click)="cancelReservation(getId(r))">
                  <mat-icon>delete</mat-icon>
                  Cancelar
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 20, 50]"
          showFirstLastButtons>
        </mat-paginator>

      </ng-container>

      <ng-template #emptyTpl>
        <div class="no-data">
          <mat-icon>event_busy</mat-icon>
          <p>Nenhuma reserva encontrada para esta semana.</p>
          <button mat-raised-button color="primary" (click)="openNewReservationDialog()">
            Criar primeira reserva
          </button>
        </div>
      </ng-template>
    </ng-container>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-button (click)="refresh()">
      <mat-icon>refresh</mat-icon>
      Atualizar
    </button>
    <button mat-raised-button color="primary" (click)="openNewReservationDialog()">
      <mat-icon>add</mat-icon>
      Nova reserva
    </button>
  </mat-card-actions>
</mat-card>
