<mat-card>
  <mat-card-title>Reservas desta semana</mat-card-title>
  <mat-card-subtitle>De hoje até +7 dias (horários com offset local)</mat-card-subtitle>

  <mat-card-content>
    <button mat-stroked-button (click)="refresh()" [disabled]="isLoading">Atualizar</button>

    <div class="spacer"></div>

    <table mat-table [dataSource]="reservations" class="mat-elevation-z1" *ngIf="reservations?.length; else empty">
      <!-- Título -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Título</th>
        <td mat-cell *matCellDef="let r">{{ r.title || 'Reserva' }}</td>
      </ng-container>

      <!-- Sala -->
      <ng-container matColumnDef="room">
        <th mat-header-cell *matHeaderCellDef>Sala</th>
        <td mat-cell *matCellDef="let r">{{ r.roomName || r.room?.name || r.roomId }}</td>
      </ng-container>

      <!-- Início -->
      <ng-container matColumnDef="start">
        <th mat-header-cell *matHeaderCellDef>Início</th>
        <!-- date pipe lê ISO com offset e exibe no local -->
        <td mat-cell *matCellDef="let r">{{ r.startTime | date:'dd/MM/yyyy HH:mm' }}</td>
      </ng-container>

      <!-- Fim -->
      <ng-container matColumnDef="end">
        <th mat-header-cell *matHeaderCellDef>Fim</th>
        <td mat-cell *matCellDef="let r">{{ r.endTime | date:'dd/MM/yyyy HH:mm' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <ng-template #empty>
      <div class="empty">Nenhuma reserva encontrada no período.</div>
    </ng-template>
  </mat-card-content>
</mat-card>
