<div class="container py-3">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h3 class="m-0">Nova relação</h3>
      <div class="text-muted small">StudentAdvisor</div>
    </div>

    <a class="btn btn-outline-secondary" routerLink="/advisor">Voltar</a>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="ok" class="alert alert-success">{{ ok }}</div>
  <div *ngIf="loading" class="alert alert-info">Salvando...</div>

  <div class="card">
    <div class="card-body">
      <div class="row g-2">
        <div class="col-12 col-md-6">
          <label class="form-label">StudentId</label>
          <input class="form-control" type="number" [(ngModel)]="studentId" />
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label">ServantId</label>
          <input class="form-control" type="number" [(ngModel)]="servantId" />
        </div>
      </div>

      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-primary" (click)="Save()" [disabled]="loading">Salvar</button>
        <a class="btn btn-outline-secondary" routerLink="/advisor">Cancelar</a>
      </div>
    </div>
  </div>
</div>
