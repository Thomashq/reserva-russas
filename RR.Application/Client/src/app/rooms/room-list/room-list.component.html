<mat-card class="p-3">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <mat-card-title class="m-0">Salas</mat-card-title>

    <button mat-raised-button color="primary" class="rr-btn" (click)="openNewRoomDialog()">
      Nova Sala
    </button>
  </div>

  <mat-card-content class="p-0">
    <ng-container *ngIf="!isLoading; else loading">
      <table mat-table [dataSource]="rooms" *ngIf="rooms?.length; else empty" class="w-100">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let room">
            {{ (room.name ?? room.Name) || '—' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="capacity">
          <th mat-header-cell *matHeaderCellDef>Capacidade</th>
          <td mat-cell *matCellDef="let room">
            {{ (room.capacity ?? room.Capacity) ?? 0 }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-end">Ações</th>
          <td mat-cell *matCellDef="let room" class="text-end">
            <div class="d-inline-flex gap-2">
              <button mat-stroked-button color="primary" class="rr-btn-outline" (click)="openRoom(room)">
                Ver
              </button>
              <button mat-raised-button color="primary" class="rr-btn" (click)="newReservation(room)">
                Reservar
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </ng-container>

    <ng-template #loading>
      <div class="py-3">Carregando...</div>
    </ng-template>

    <ng-template #empty>
      <div class="py-3">Nenhuma sala encontrada.</div>
    </ng-template>
  </mat-card-content>
</mat-card>
