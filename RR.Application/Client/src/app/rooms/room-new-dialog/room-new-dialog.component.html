<div mat-dialog-content>
  <h2 mat-dialog-title> Nova Sala </h2>

  <!-- Loading visual durante a criação -->
  <mat-progress-spinner *ngIf="isLoading"
                        mode="indeterminate"
                        diameter="28"
                        style="margin: 8px 0;">
  </mat-progress-spinner>

  <form [formGroup]="frmCreateRoom"
        (ngSubmit)="salvarSala()"
        class="form"
        [attr.aria-busy]="isLoading">
    <div class="grid">
      <mat-form-field>
        <mat-label> Nome </mat-label>
        <input matInput formControlName="Name" required [disabled]="isLoading" />
      </mat-form-field>

      <mat-form-field>
        <mat-label> Capacidade </mat-label>
        <input matInput type="number" formControlName="Capacity" required [disabled]="isLoading" />
      </mat-form-field>
    </div>

    <div mat-dialog-actions align="end">
      <button mat-button mat-dialog-close [disabled]="isLoading"> Cancelar </button>
      <button mat-raised-button color="primary" type="submit"
              [disabled]="isLoading || frmCreateRoom.invalid">
        Salvar
      </button>
    </div>
  </form>
</div>
