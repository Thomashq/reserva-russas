<div mat-dialog-content class="p-3">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h2 class="m-0">Nova Sala</h2>

    <mat-progress-spinner
      *ngIf="isLoading"
      mode="indeterminate"
      diameter="22">
    </mat-progress-spinner>
  </div>

  <form [formGroup]="frmCreateRoom"
        (ngSubmit)="salvarSala()"
        [attr.aria-busy]="isLoading">

    <div class="row g-2">
      <div class="col-12 col-md-8">
        <mat-form-field class="w-100">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="Name" required [disabled]="isLoading" />
        </mat-form-field>
      </div>

      <div class="col-12 col-md-4">
        <mat-form-field class="w-100">
          <mat-label>Capacidade</mat-label>
          <input matInput type="number" formControlName="Capacity" required [disabled]="isLoading" />
        </mat-form-field>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-3">
      <button mat-stroked-button color="primary" type="button" class="rr-btn-outline" (click)="onCancel()" [disabled]="isLoading">
        Cancelar
      </button>

      <button mat-raised-button color="primary" type="submit" class="rr-btn"
              [disabled]="isLoading || frmCreateRoom.invalid">
        Salvar
      </button>
    </div>
  </form>
</div>
