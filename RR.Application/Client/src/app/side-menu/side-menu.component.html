<!-- Só exibe o menu se houver uma account válida -->
<div *ngIf="account as acc" class="d-flex flex-column h-100">

  <!-- Busca rápida -->
  <div class="menu-section mb-3">
    <div class="search-label">Buscar</div>

    <mat-form-field appearance="outline" class="w-100 search-field">
      <input matInput
             [(ngModel)]="searchText"
             (keyup.enter)="onSearchEnter()"
             placeholder="Salas, reservas..." />
      <button mat-icon-button
              matSuffix
              type="button"
              (click)="onSearchEnter()">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
  </div>


  <!-- Bloco com info resumida da conta -->
  <div class="menu-section d-flex align-items-center mb-3">
    <div class="d-flex align-items-center justify-content-center me-2 rounded-3 avatar">
      {{ (acc.UserName ?? acc.Mail ?? '?')[0] | uppercase }}
    </div>

    <div class="d-flex flex-column">
      <span class="fw-semibold">{{ acc.UserName || acc.Mail }}</span>
      <small class="text-muted">
        {{ getPermissionLabel(acc) }}
      </small>
    </div>
  </div>

  <!-- HOME -->
  <div class="menu-section mb-2">
    <a class="menu-home d-flex align-items-center"
       routerLink="/home"
       routerLinkActive="active-link">
      <mat-icon class="me-1">home</mat-icon>
      <span>Home</span>
    </a>
  </div>

  <!-- Navegação (Salas / Reservas / Infos da conta) -->
  <mat-nav-list class="flex-grow-1">

    <!-- SALAS -->
    <mat-expansion-panel class="menu-panel">
      <mat-expansion-panel-header>
        <mat-panel-title>Salas</mat-panel-title>
      </mat-expansion-panel-header>

      <a mat-list-item (click)="navigateToRooms()">
        <span>Listar salas</span>
      </a>

    </mat-expansion-panel>

    <!-- RESERVAS -->
    <mat-expansion-panel class="menu-panel">
      <mat-expansion-panel-header>
        <mat-panel-title>Reservas</mat-panel-title>
      </mat-expansion-panel-header>

      <a mat-list-item routerLink="/reservas" routerLinkActive="active-link">
        <span>Minhas reservas</span>
      </a>

      <a mat-list-item routerLink="/reservas/nova" routerLinkActive="active-link">
        <span>Nova reserva</span>
      </a>
    </mat-expansion-panel>

    <!-- INFOS DA CONTA -->
    <mat-expansion-panel class="menu-panel">
      <mat-expansion-panel-header>
        <mat-panel-title>Infos da conta</mat-panel-title>
      </mat-expansion-panel-header>

      <a mat-list-item routerLink="/conta" routerLinkActive="active-link">
        <span>Dados da conta</span>
      </a>

      <button mat-list-item type="button" (click)="logout()">
        <span>Sair</span>
      </button>
    </mat-expansion-panel>

  </mat-nav-list>
</div>
